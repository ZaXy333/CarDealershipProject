<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
    <h:head>
        <title>Logowanie - Salon Samochodowy</title>
    </h:head>
    <h:body>
        <h2>Logowanie do systemu</h2>
        <h:form pt:method="post" pt:action="#{facesContext.externalContext.encodeActionURL('j_security_check')}">
            <div>
                <label for="j_username">Login:</label>
                <h:inputText pt:name="j_username" id="j_username"/>
            </div>
            <div>
                <label for="j_password">Hasło:</label>
                <h:inputSecret pt:name="j_password" id="j_password"/>
            </div>
            <div>
                <input type="submit" value="Zaloguj"/>
            </div>
        </h:form>
    </h:body>
</html>
