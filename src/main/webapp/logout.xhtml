<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
    <h:head>
        <title>Wylogowano — AutoElite</title>
        <h:outputStylesheet library="css" name="style.css"/>
    </h:head>
    <h:body styleClass="auth-body">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-brand">AutoElite</h1>
                    <p class="auth-subtitle">Zakończenie pracy</p>
                </div>

                <div class="auth-info">
                    Zostałeś bezpiecznie wylogowany z systemu.
                </div>

                <h:outputText value="#{session.invalidate()}" styleClass="hidden-element"/>
                <h:link value="Zaloguj ponownie" outcome="/views/index" styleClass="auth-submit"/>
            </div>
        </div>
    </h:body>
</html>
