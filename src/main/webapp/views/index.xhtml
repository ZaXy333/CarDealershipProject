<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                template="/WEB-INF/templates/mainTemplate.xhtml">
    <ui:define name="content">
        <h2>#{msgs.calcHeader}</h2>
        <h:form id="calcForm">
            <div class="form-grid">
                <h:outputLabel for="price" value="#{msgs.calcPrice}:"/>
                <h:inputText id="price" value="#{dashboardViewBean.carPricePln}"/>

                <h:outputLabel for="months" value="#{msgs.calcMonths}:"/>
                <h:inputText id="months" value="#{dashboardViewBean.months}"/>
            </div>

            <h:commandButton value="#{msgs.calcButton}" action="#{dashboardViewBean.calculate()}" styleClass="nav-btn"/>

            <div class="result-box">
                <p>#{msgs.calcResultPln}: <strong>#{dashboardViewBean.monthlyInstallmentPln} PLN</strong></p>
                <p>#{msgs.calcResultEur}: <strong>#{dashboardViewBean.monthlyInstallmentEur} EUR</strong></p>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
